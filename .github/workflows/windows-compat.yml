name: Windows Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-compat.yml'
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'package-resources.manifest.json'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'scripts/release/**'

concurrency:
  group: windows-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '23'
  PNPM_VERSION: '10.32.1'
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.25.x'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows-compat:
    name: Windows x64 compatibility
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @movscript/core build

      - name: Run Windows-focused frontend service tests
        run: node scripts/run-node-tests.mjs apps/frontend/electron/services/desktopIdentity.test.ts apps/frontend/electron/services/appServerRuntimeCommand.test.ts apps/frontend/electron/services/movscriptCliPath.test.ts apps/frontend/electron/services/localTerminalEnv.test.ts

      - name: Run backend handler tests
        working-directory: apps/backend
        run: go test ./internal/interfaces/http/handler

      - name: Verify package resource contract
        run: pnpm run verify:package-resources

      - name: Download Windows ffmpeg-static release binary
        run: pnpm run release -- download-ffmpeg-static --platform=win32 --arch=x64

      - name: Build unsigned Windows desktop package
        run: pnpm run release -- package-desktop --platform=win32 --arch=x64 --unsigned
        env:
          MOVSCRIPT_RELEASE_SIGNING_MODE: unsigned

      - name: Smoke test Windows desktop package
        run: pnpm run release -- smoke-desktop-package --platform=win32 --arch=x64

      - name: Upload Windows release output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-compat-release-output
          path: |
            apps/frontend/release/**
            apps/frontend/vendor/ffmpeg/**
          if-no-files-found: ignore
          retention-days: 7
