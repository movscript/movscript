name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0 or v0.1.0-test.1'
        required: true
        type: string
      release_channel:
        description: 'Release channel. Use test for vX.Y.Z-test.N packages.'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - test

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '23'
  PNPM_VERSION: '10.32.1'
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.25.x'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release-checks:
    name: Release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/data-service/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release check gate
        run: pnpm run release -- check
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          MOVSCRIPT_RELEASE_ALLOW_TEST_TAG: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_channel == 'test') || contains(github.ref_name, '-test.')) && '1' || '0' }}
          MOVSCRIPT_RELEASE_REQUIRE_SIGNING: '0'
          MOVSCRIPT_RELEASE_SIGNING_MODE: unsigned
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  package:
    name: Package ${{ matrix.name }}
    needs: [release-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            package-platform: darwin
            package-arch: arm64
            artifact: movscript-desktop-macos-arm64
            ffmpeg-platform: darwin
            ffmpeg-arch: arm64
          - name: macos-x64
            os: macos-14
            package-platform: darwin
            package-arch: x64
            artifact: movscript-desktop-macos-x64
            ffmpeg-platform: darwin
            ffmpeg-arch: x64
          - name: windows-x64
            os: windows-2022
            package-platform: win32
            package-arch: x64
            artifact: movscript-desktop-windows-x64
            ffmpeg-platform: win32
            ffmpeg-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/data-service/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Apple signing files
        if: matrix.package-platform == 'darwin'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK_CONTENT: ${{ secrets.CSC_LINK }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

          CSC_LINK_PATH="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$CSC_LINK_CONTENT" | base64 --decode > "$CSC_LINK_PATH"
          chmod 600 "$CSC_LINK_PATH"

          KEYCHAIN_PATH="$RUNNER_TEMP/movscript-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CSC_LINK_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"
          IDENTITY_NAME="$(security find-identity -p codesigning -v "$KEYCHAIN_PATH" | sed -n 's/.*"Developer ID Application: *\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY_NAME" ]; then
            echo "No Developer ID Application signing identity was imported from CSC_LINK." >&2
            exit 1
          fi

          echo "CSC_LINK=$CSC_LINK_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CSC_NAME=$IDENTITY_NAME" >> "$GITHUB_ENV"

      - name: Verify release readiness
        run: pnpm run release -- verify-release-readiness --tag="$RELEASE_TAG" --platform=${{ matrix.package-platform }}
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          MOVSCRIPT_RELEASE_ALLOW_TEST_TAG: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_channel == 'test') || contains(github.ref_name, '-test.')) && '1' || '0' }}
          MOVSCRIPT_RELEASE_REQUIRE_SIGNING: ${{ matrix.package-platform == 'darwin' && '1' || '0' }}
          MOVSCRIPT_RELEASE_SIGNING_MODE: ${{ matrix.package-platform == 'darwin' && 'signed' || 'unsigned' }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify package resource contract
        run: pnpm run verify:package-resources

      - name: Download ffmpeg-static release binary
        run: pnpm run release -- download-ffmpeg-static --platform=${{ matrix.ffmpeg-platform }} --arch=${{ matrix.ffmpeg-arch }}

      - name: Prepare desktop package prerequisites
        run: pnpm run release -- prepare --app desktop --platform=${{ matrix.package-platform }} --arch=${{ matrix.package-arch }}

      - name: Diagnostic typecheck desktop bundle on target runner
        continue-on-error: true
        run: pnpm run release -- typecheck --app desktop --platform=${{ matrix.package-platform }} --arch=${{ matrix.package-arch }}

      - name: Build desktop bundle
        run: pnpm run release -- build --app desktop --stage bundle --platform=${{ matrix.package-platform }} --arch=${{ matrix.package-arch }}
        env:
          MOVSCRIPT_ELECTRON_VITE_DEBUG: ${{ matrix.package-platform == 'win32' && '1' || '0' }}

      - name: Build desktop artifact
        run: pnpm run release -- build --app desktop --stage artifact --platform=${{ matrix.package-platform }} --arch=${{ matrix.package-arch }}
        env:
          MOVSCRIPT_RELEASE_SIGNING_MODE: ${{ matrix.package-platform == 'darwin' && 'signed' || 'unsigned' }}
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify desktop package
        run: pnpm run release -- verify --app desktop --platform=${{ matrix.package-platform }} --arch=${{ matrix.package-arch }}
        env:
          MOVSCRIPT_RELEASE_SIGNING_MODE: ${{ matrix.package-platform == 'darwin' && 'signed' || 'unsigned' }}
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Install Linux smoke test display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test desktop package
        run: pnpm run release -- smoke-desktop-package --platform=${{ matrix.package-platform }} --arch=${{ matrix.package-arch }}

      - name: Collect release artifacts
        run: pnpm run release -- collect --app desktop
        env:
          MOVSCRIPT_COLLECT_PLUGINS: '0'
          MOVSCRIPT_ARTIFACT_PREFIX: ${{ matrix.artifact }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  package-plugin:
    name: Package Agent Plugin
    needs: [release-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package plugin app
        run: pnpm run release -- package --app plugin

      - name: Collect plugin release artifact
        run: pnpm run release -- collect --app plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: movscript-agent-plugin
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft GitHub Release
    needs: [package, package-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.release_channel }}" = "test" ]; then
              echo "is_test=true" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "${{ inputs.tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$'; then
              echo "is_test=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_test=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$'; then
              echo "is_test=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_test=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: movscript-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Create combined checksums
        run: |
          find downloaded-artifacts -maxdepth 1 -type f -name '*SHA256SUMS.txt' -delete
          find downloaded-artifacts -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > downloaded-artifacts/SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: downloaded-artifacts/*

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_TEST_RELEASE: ${{ steps.release.outputs.is_test }}
        run: |
          if [ "$IS_TEST_RELEASE" = "true" ]; then
            RELEASE_FLAGS="--draft --prerelease"
          else
            RELEASE_FLAGS=""
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" $RELEASE_FLAGS --title "$RELEASE_TAG" --notes-file .github/release-workspace-notes.md
          else
            gh release create "$RELEASE_TAG" $RELEASE_FLAGS --title "$RELEASE_TAG" --notes-file .github/release-workspace-notes.md
          fi
          gh release upload "$RELEASE_TAG" downloaded-artifacts/* --clobber
          if [ "$IS_TEST_RELEASE" != "true" ]; then
            RELEASE_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id" | head -n 1)"
            if [ -z "$RELEASE_ID" ]; then
              echo "Unable to locate GitHub release for tag ${RELEASE_TAG}" >&2
              exit 1
            fi
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | select(.name | test("^(latest-win32-arm64\\.yml|movscript-desktop-windows-arm64-)")) | [.id, .name] | @tsv' |
            while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
              if [ -z "$ASSET_ID" ]; then
                continue
              fi
              echo "Deleting stale Windows ARM64 release asset: $ASSET_NAME"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
            done
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -F prerelease=false
          fi

      - name: Refresh installer page metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
