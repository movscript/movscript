name: Deploy Installer Page

on:
  push:
    branches:
      - main
    paths:
      - install.sh
      - docs/install.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p public
          cp install.sh public/install.sh
          chmod 0644 public/install.sh
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Movscript Installer</title>
            </head>
            <body>
              <main>
                <h1>Movscript Installer</h1>
                <pre><code>curl -fsSL https://movscript.com/install.sh | sh</code></pre>
                <p>Release packages are downloaded from GitHub Releases.</p>
              </main>
            </body>
          </html>
          HTML
          if [ -n "${MOVSCRIPT_PAGES_DOMAIN:-}" ]; then
            printf '%s\n' "$MOVSCRIPT_PAGES_DOMAIN" > public/CNAME
          fi
        env:
          MOVSCRIPT_PAGES_DOMAIN: ${{ vars.MOVSCRIPT_PAGES_DOMAIN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
