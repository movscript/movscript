name: Refresh Installer Page

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch Pages Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy installer page from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
