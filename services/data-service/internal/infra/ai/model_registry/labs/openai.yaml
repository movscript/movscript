    - order: 16
      id: openai:gpt-4o-mini-tts
      lab: openai
      model_id: gpt-4o-mini-tts
      display_name: GPT-4o mini TTS
      adapter_type: openai_compat
      capabilities:
        - audio_tts
      params:
        - key: voice
          label: 音色
          type: select
          options:
            - alloy
            - ash
            - ballad
            - coral
            - echo
            - fable
            - onyx
            - nova
            - sage
            - shimmer
            - verse
          default: alloy
        - key: response_format
          label: 音频格式
          type: select
          options:
            - mp3
            - opus
            - aac
            - flac
            - wav
            - pcm
          default: mp3
        - key: speed
          label: 语速
          type: number
          default: 1
          min: 0.25
          max: 4
          step: 0.01
        - key: instructions
          label: 语音指令
          type: string
          default: ""
      source:
        url: https://developers.openai.com/api/docs/guides/text-to-speech
        verified_at: "2026-06-25"
        status: verified
