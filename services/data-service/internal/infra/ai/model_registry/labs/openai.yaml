        status: deprecated
    - order: 13
      id: openai:gpt-image-1
      lab: openai
      model_id: gpt-image-1
      display_name: GPT Image 1 (文生图)
      adapter_type: openai_compat
      capabilities:
        - image
      params:
        - key: image_size
          label: 尺寸
          type: string
          default: auto
          json_schema:
            pattern: ^(auto|[1-9][0-9]{0,3}x[1-9][0-9]{0,3})$
            x_movscript_image_size:
              allow_auto: true
              width_multiple_of: 16
              height_multiple_of: 16
              max_width: 3840
              max_height: 2160
              min_aspect_ratio: 0.3333333333333333
              max_aspect_ratio: 3
        - key: quality
          label: 质量
          type: select
          options:
            - auto
            - high
            - medium
            - low
          default: auto
      source:
        url: https://developers.openai.com/api/reference/resources/images
        verified_at: "2026-06-25"
        status: deprecated
    - order: 14
      id: openai:gpt-image-1-edit
      lab: openai
      model_id: gpt-image-1
      display_name: GPT Image 1 (图像编辑)
      adapter_type: openai_compat
      capabilities:
        - image_edit
      input:
        accepts_image: true
        max_images: 1
      image_edit_field: image[]
      params:
        - key: image_size
          label: 尺寸
          type: select
          options:
            - auto
            - 1024x1024
            - 1536x1024
            - 1024x1536
          default: auto
        - key: quality
