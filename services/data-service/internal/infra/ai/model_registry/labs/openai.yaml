      display_name: DALL-E 3
      adapter_type: openai_compat
      capabilities:
        - image
      params:
        - key: image_size
          label: 画面尺寸
          type: select
          options:
            - 1024x1024
            - 1024x1792
            - 1792x1024
          default: 1024x1024
        - key: quality
          label: 质量
          type: select
          options:
            - standard
            - hd
          default: standard
        - key: style
          label: 风格
          type: select
          options:
            - vivid
            - natural
          default: vivid
      source:
