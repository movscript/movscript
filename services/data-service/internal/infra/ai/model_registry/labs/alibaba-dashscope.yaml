      capabilities:
        - audio_chat
      display_name: Qwen3 Omni Flash
      id: dashscope:qwen3-omni-flash
      lab: alibaba-dashscope
      model_id: qwen3-omni-flash-realtime
      order: 71
      params:
        - key: voice
          label: 音色
          type: string
          default: Ethan
        - key: input_audio_format
          label: 输入音频格式
          type: select
          options:
            - pcm
            - g711_ulaw
            - g711_alaw
          default: pcm
        - key: output_audio_format
          label: 输出音频格式
          type: select
          options:
            - pcm
            - wav
            - mp3
            - opus
          default: pcm
        - key: output_sample_rate
          label: 输出采样率
          type: number
          default: 24000
          min: 8000
          max: 48000
