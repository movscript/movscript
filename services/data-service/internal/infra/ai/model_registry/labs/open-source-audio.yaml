lab: open-source-audio
templates:
    - order: 1
      id: open-source-audio:musicgen
      lab: open-source-audio
      model_id: musicgen
      display_name: MusicGen / AudioCraft
      adapter_type: local
      capabilities:
        - audio_music
      params:
        - key: duration
          label: 时长(秒)
          type: select
          options:
            - "5"
            - "10"
            - "15"
            - "30"
          default: "10"
        - key: output_format
          label: 音频格式
          type: select
          options:
            - wav
            - mp3
          default: wav
        - key: negative_prompt
          label: 负向提示词
          type: string
          default: ""
      source:
        url: https://github.com/facebookresearch/audiocraft
        verified_at: "2026-06-26"
        status: verified
