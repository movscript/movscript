providers:
  - provider_type: openai
    profile: official
    provider_kind: openai_compat_gateway
    provider_category: official_platform
    display_name: OpenAI 官方 API
    description: OpenAI official account boundary using the OpenAI-compatible API shape.
    default_adapter_type: openai_compat
    default_base_url_prefix: https://api.openai.com/v1
    capabilities:
      aggregates_upstream_models: false
      file_upload: true
      asset_library: false
      generated_artifact_trust: false
    is_builtin: true
    is_enabled: true
    version: builtin.v1
