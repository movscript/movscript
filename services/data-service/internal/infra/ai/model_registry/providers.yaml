  - provider_type: volcen
    profile: ark
    provider_kind: volcengine_ark_official
    provider_category: official_platform
    display_name: 火山方舟官方 API
    description: Volcengine Ark official API. Owns Ark account boundary, asset library, and original artifact trust policy.
    default_adapter_type: volcen
    default_base_url_prefix: https://ark.cn-beijing.volces.com/api/v3
    capabilities:
      asset_library: true
      generated_artifact_trust: true
      requires_public_input_url_for_asset_upload: true
      file_upload: true
      task_polling: true
      task_cancel: true
    asset_library_capabilities:
      asset_types: [image]
      auto_create_groups: true
      group_scopes: [global, project_setting]
    generated_artifact_trust_policy:
      policy_id: volcengine_ark_original_face_artifact_v1
      scope: same_provider_account
      requires_original_artifact: true
      trusted_model_families: [seedream-lite, seedance-2.0]
    is_builtin: true
    is_enabled: true
    version: builtin.v1
  - provider_type: yunwu
    profile: gateway
    provider_kind: yunwu_gateway
    provider_category: aggregator_gateway
    display_name: 云雾中转站
    description: Yunwu relay gateway account boundary. It can aggregate multiple model labs and additionally exposes a private portrait asset library for Seedance workflows.
    default_adapter_type: openai_compat
    default_base_url_prefix: https://yunwu.ai/v1
    capabilities:
      aggregates_upstream_models: true
      asset_library: true
      generated_artifact_trust: false
      requires_public_input_url_for_asset_upload: true
      file_upload: false
      task_polling: true
      task_cancel: false
    asset_library_capabilities:
      asset_types: [image]
      auto_create_groups: false
      group_scopes: []
    is_builtin: true
    is_enabled: true
    version: builtin.v1
