global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: movscript-agent
    metrics_path: /metrics
    static_configs:
      - targets:
          # Docker Desktop on macOS/Windows can reach the host agent through this name.
          - host.docker.internal:28765
        labels:
          service: movscript-agent
          source: local-dev
