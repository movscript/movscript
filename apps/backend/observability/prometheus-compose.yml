global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: movscript-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8765
        labels:
          service: movscript-backend
          source: docker-compose

  - job_name: movscript-agent-runtime
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:28765
        labels:
          service: movscript-agent
          source: host

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: host
          source: docker-compose

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: containers
          source: docker-compose
