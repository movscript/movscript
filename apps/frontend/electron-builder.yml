appId: com.movscript.desktop
productName: Movscript
asar: true
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@movscript/mova*/vendor/**/bin/codex-app-server*
  - node_modules/@movscript/mova*/vendor/**/codex-path/**
  - node_modules/@movscript/mova*/vendor/**/codex-resources/**
  - node_modules/@movscript/mova*/vendor/**/codex-package.json

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - "!node_modules/@movscript/mova*/vendor/**/bin/mova*"

extraResources:
  - from: ../../assets/logo.png
    to: logo.png
  - from: ../backend/bin
    to: backend
    filter:
      - movscript-server
      - movscript-server.exe
  - from: ../admin/dist
    to: admin
    filter:
      - "**/*"
  - from: ../../plugins/movscript
    to: provider-plugins/movscript
    filter:
      - .provider-plugin/**
      - .codex-plugin/**
      - .mcp.json
      - bin/**
      - skills/**
      - README.md
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - "**/ffmpeg"
      - "**/ffmpeg.exe"
      - "**/METADATA.json"
  - from: ../cli
    to: movcli
    filter:
      - bin/**
      - dist/**
      - package.json
mac:
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  target:
    - dmg
    - zip
  category: public.app-category.productivity

linux:
  target:
    - AppImage
  category: Utility

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
