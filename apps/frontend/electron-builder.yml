appId: com.movscript.desktop
productName: Movscript
asar: true
asarUnpack:
  - node_modules/node-pty/**

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: ../../assets/logo.png
    to: logo.png
  - from: ../backend/bin
    to: backend
    filter:
      - movscript-server
      - movscript-server.exe
      - server
      - server.exe
      - admin/**
  - from: ../../plugins/movscript
    to: provider-plugins/movscript
    filter:
      - .provider-plugin/**
      - .codex-plugin/**
      - .mcp.json
      - bin/**
      - skills/**
      - README.md
  - from: ../cli
    to: movcli
    filter:
      - bin/**
      - dist/**
      - package.json
  - from: vendor/app-server
    to: app-server
    filter:
      - "**/app-server"
      - "**/app-server.exe"
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - "**/ffmpeg"
      - "**/ffmpeg.exe"
      - "**/METADATA.json"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity

linux:
  target:
    - AppImage
  category: Utility

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
