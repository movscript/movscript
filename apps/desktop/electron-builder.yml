appId: com.movscript.desktop
productName: Movscript
asar: true
publish:
  provider: github
  owner: movscript
  repo: movscript
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@movscript/mova*/vendor/**/bin/codex-app-server*
  - node_modules/@movscript/mova*/vendor/**/codex-path/**
  - node_modules/@movscript/mova*/vendor/**/codex-resources/**
  - node_modules/@movscript/mova*/vendor/**/codex-package.json

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - "!node_modules/@movscript/**/*.d.ts"
  - "!node_modules/@movscript/**/*.d.ts.map"
  - "!node_modules/@movscript/**/*.tsbuildinfo"
  - "!node_modules/@movscript/mova*/vendor/**/bin/mova*"

extraResources:
  - from: ../../assets/logo.png
    to: logo.png
  - from: ../../assets/trayTemplate.png
    to: trayTemplate.png
  - from: ../../assets/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/native/movscript-native-tray
    to: native/movscript-native-tray
  - from: ../../surface/admin/dist
    to: admin
    filter:
      - "**/*"
  - from: ../../plugins/movscript
    to: provider-plugins/movscript
    filter:
      - .provider-plugin/**
      - .codex-plugin/**
      - .mcp.json
      - assets/**
      - bin/**
      - manifest.runtime.json
      - runtime/**
      - skills/**
      - README.md
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - "**/ffmpeg"
      - "**/ffmpeg.exe"
      - "**/METADATA.json"
mac:
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  target:
    - dmg
    - zip
  category: public.app-category.productivity

linux:
  target:
    - AppImage
  category: Utility

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
