<svg width="1680" height="1120" viewBox="0 0 1680 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1680" height="1120" fill="#F6F7F9"/>
  <rect x="70" y="58" width="1540" height="1004" rx="34" fill="#FFFFFF" stroke="#D8DEE8"/>
  <text x="112" y="126" fill="#121826" font-family="Inter, PingFang SC, sans-serif" font-size="36" font-weight="760">统一模型调用 UI / V3</text>
  <text x="112" y="166" fill="#647084" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="560">四个入口同一结构：上方提示词编辑器，引用以文字等高 chip 插入。</text>
  <text x="112" y="196" fill="#647084" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="560">下方是模型、品类、输出、尺寸/时长等参数；参数下方固定显示本次调用预览。</text>

  <rect x="112" y="220" width="1456" height="326" rx="24" fill="#FAFBFC" stroke="#D9E0EA"/>
  <text x="146" y="268" fill="#1D2736" font-family="Inter, PingFang SC, sans-serif" font-size="22" font-weight="760">提示词编辑器</text>
  <text x="146" y="300" fill="#697586" font-family="Inter, PingFang SC, sans-serif" font-size="15" font-weight="560">chip 不是文件名，也不是状态；它由 类型短标 + role + 来源短身份 组成。</text>

  <rect x="146" y="330" width="930" height="142" rx="18" fill="#FFFFFF" stroke="#CFD7E4"/>
  <text x="172" y="382" fill="#293548" font-family="Inter, PingFang SC, sans-serif" font-size="20" font-weight="560">镜头从窗边缓慢推进，角色抬头看向远处，使用</text>
  <g transform="translate(612 353)">
    <rect width="118" height="28" rx="14" fill="#E6FFFA" stroke="#6CC7B4"/>
    <circle cx="15" cy="14" r="9" fill="#CFF7EE"/>
    <text x="10" y="18" fill="#0F766E" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="800">图</text>
    <text x="30" y="19" fill="#12342F" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="780">首帧</text>
    <text x="70" y="19" fill="#4F6F69" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="700">资源</text>
  </g>
  <text x="742" y="382" fill="#293548" font-family="Inter, PingFang SC, sans-serif" font-size="20" font-weight="560">作为构图参考，尾部用</text>
  <g transform="translate(945 353)">
    <rect width="130" height="28" rx="14" fill="#FFF7E5" stroke="#E0A13A"/>
    <circle cx="15" cy="14" r="9" fill="#FDE7B6"/>
    <text x="10" y="18" fill="#92400E" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="800">图</text>
    <text x="30" y="19" fill="#3C2711" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="780">尾帧</text>
    <text x="70" y="19" fill="#72542C" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="700">关键帧</text>
  </g>
  <text x="172" y="428" fill="#293548" font-family="Inter, PingFang SC, sans-serif" font-size="20" font-weight="560">保持服装一致，运动参考使用</text>
  <g transform="translate(452 399)">
    <rect width="148" height="28" rx="14" fill="#EEF2FF" stroke="#8797E8"/>
    <circle cx="15" cy="14" r="9" fill="#DDE4FF"/>
    <text x="10" y="18" fill="#3730A3" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="800">视</text>
    <text x="30" y="19" fill="#1D245F" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="780">视频参考</text>
    <text x="96" y="19" fill="#545B8A" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="700">故事版</text>
  </g>

  <rect x="1120" y="300" width="396" height="210" rx="18" fill="#FFFFFF" stroke="#CFD7E4"/>
  <text x="1150" y="342" fill="#1D2736" font-family="Inter, PingFang SC, sans-serif" font-size="19" font-weight="760">插入引用时选择 role</text>
  <text x="1150" y="374" fill="#697586" font-family="Inter, PingFang SC, sans-serif" font-size="14" font-weight="560">拖拽资源或点击 chip 均打开同一菜单</text>
  <g transform="translate(1150 398)">
    <rect width="336" height="34" rx="10" fill="#E6FFFA" stroke="#87D8C8"/>
    <text x="16" y="23" fill="#0F766E" font-family="Inter, PingFang SC, sans-serif" font-size="14" font-weight="760">首帧</text>
    <text x="86" y="23" fill="#496B66" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="560">用于首帧生视频</text>
  </g>
  <g transform="translate(1150 440)">
    <rect width="336" height="34" rx="10" fill="#FFF7E5" stroke="#E6B562"/>
    <text x="16" y="23" fill="#92400E" font-family="Inter, PingFang SC, sans-serif" font-size="14" font-weight="760">尾帧</text>
    <text x="86" y="23" fill="#745429" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="560">用于首尾帧生视频</text>
  </g>

  <rect x="112" y="586" width="1456" height="332" rx="24" fill="#FAFBFC" stroke="#D9E0EA"/>
  <text x="146" y="634" fill="#1D2736" font-family="Inter, PingFang SC, sans-serif" font-size="22" font-weight="760">模型与参数</text>
  <text x="146" y="666" fill="#697586" font-family="Inter, PingFang SC, sans-serif" font-size="15" font-weight="560">参数选择区仍然是控件；摘要区只预览本次实际调用，不承担编辑。</text>

  <g transform="translate(146 704)">
    <rect width="226" height="78" rx="16" fill="#FFFFFF" stroke="#CFD7E4"/>
    <text x="18" y="30" fill="#647084" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="700">品类</text>
    <text x="18" y="57" fill="#162033" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="760">首尾帧生视频</text>
  </g>
  <g transform="translate(388 704)">
    <rect width="160" height="78" rx="16" fill="#FFFFFF" stroke="#CFD7E4"/>
    <text x="18" y="30" fill="#647084" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="700">输出</text>
    <text x="18" y="57" fill="#162033" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="760">视频</text>
  </g>
  <g transform="translate(564 704)">
    <rect width="330" height="78" rx="16" fill="#FFFFFF" stroke="#CFD7E4"/>
    <text x="18" y="30" fill="#647084" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="700">模型</text>
    <text x="18" y="57" fill="#162033" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="760">video-reference-v2</text>
  </g>
  <g transform="translate(910 704)">
    <rect width="136" height="78" rx="16" fill="#FFFFFF" stroke="#CFD7E4"/>
    <text x="18" y="30" fill="#647084" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="700">尺寸</text>
    <text x="18" y="57" fill="#162033" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="760">16:9</text>
  </g>
  <g transform="translate(1062 704)">
    <rect width="136" height="78" rx="16" fill="#FFFFFF" stroke="#CFD7E4"/>
    <text x="18" y="30" fill="#647084" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="700">时长</text>
    <text x="18" y="57" fill="#162033" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="760">6s</text>
  </g>

  <text x="146" y="832" fill="#1D2736" font-family="Inter, PingFang SC, sans-serif" font-size="17" font-weight="760">本次调用预览</text>
  <g transform="translate(146 852)">
    <rect width="110" height="30" rx="15" fill="#E6FFFA" stroke="#84D8C8"/>
    <text x="14" y="20" fill="#57716E" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="720">品类</text>
    <text x="52" y="20" fill="#12342F" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="790">首尾帧</text>
  </g>
  <g transform="translate(266 852)">
    <rect width="86" height="30" rx="15" fill="#FFFFFF" stroke="#D1DAE6"/>
    <text x="14" y="20" fill="#697586" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="720">输出</text>
    <text x="52" y="20" fill="#1D2736" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="790">视频</text>
  </g>
  <g transform="translate(362 852)">
    <rect width="214" height="30" rx="15" fill="#FFFFFF" stroke="#D1DAE6"/>
    <text x="14" y="20" fill="#697586" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="720">模型</text>
    <text x="52" y="20" fill="#1D2736" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="790">video-reference-v2</text>
  </g>
  <g transform="translate(586 852)">
    <rect width="106" height="30" rx="15" fill="#FFFFFF" stroke="#D1DAE6"/>
    <text x="14" y="20" fill="#697586" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="720">尺寸</text>
    <text x="52" y="20" fill="#1D2736" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="790">16:9</text>
  </g>
  <g transform="translate(702 852)">
    <rect width="96" height="30" rx="15" fill="#FFFFFF" stroke="#D1DAE6"/>
    <text x="14" y="20" fill="#697586" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="720">时长</text>
    <text x="52" y="20" fill="#1D2736" font-family="Inter, PingFang SC, sans-serif" font-size="12" font-weight="790">6s</text>
  </g>

  <rect x="112" y="948" width="1456" height="66" rx="20" fill="#F1F5F9" stroke="#D9E0EA"/>
  <text x="146" y="978" fill="#334155" font-family="Inter, PingFang SC, sans-serif" font-size="17" font-weight="700">验收目标：四处入口不得再出现“图 已选 Asset”这种状态/英文来源混入 chip 的情况。</text>
  <text x="146" y="1004" fill="#334155" font-family="Inter, PingFang SC, sans-serif" font-size="17" font-weight="700">chip 必须显示 role；参数选择区下方必须显示本次调用预览。</text>
</svg>
